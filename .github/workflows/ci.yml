name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.13.0+cpu --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Train model (non-interactive, uses committed constraints)
        run: python src/train.py

      - name: Check the model artifact was produced
        run: test -f models/model.joblib

      - name: Build Docker image
        run: docker build -t igann-mlops .

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/igann-mlops
          docker tag igann-mlops $IMAGE:latest
          docker tag igann-mlops $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}